.shooting-star {

  top: var(--top, 15%);
  left: -180px;
  width: 130px;
  height: 2px;
  border-radius: 999px;
  pointer-events: none;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(169, 217, 255, 0.4),
    rgba(255, 255, 255, 0.95)
  );

  box-shadow:
    0 0 6px rgba(169, 217, 255, 0.7),
    0 0 14px rgba(169, 217, 255, 0.35);

  opacity: 0;
  transform: rotate(25deg);
  transform-origin: right center;

  animation: shoot 15s linear infinite;
  animation-delay: var(--delay, 0s);
}
